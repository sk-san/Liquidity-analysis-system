[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hft-market-data-protocol"
version = "0.1.0"
description = "Canonical MessagePack market-data contract for the ABIDES HFT simulation stack"
requires-python = ">=3.11"
dependencies = ["msgpack>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]
