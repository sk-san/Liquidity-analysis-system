[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abides-market-data-emitter"
version = "0.1.0"
description = "Durable asynchronous ZeroMQ market-data emitter for ABIDES-JPMC forks"
requires-python = ">=3.11"
dependencies = [
  "hft-market-data-protocol>=0.1.0",
  "pyzmq>=25",
]

[tool.setuptools.packages.find]
where = ["src"]
